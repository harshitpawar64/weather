name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest-known"
          activate-environment: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: ruff check

      - name: Format check
        if: always()
        run: ruff format --check

      - name: Type check
        if: always()
        run: ty check

      - name: Run tests
        if: always()
        run: pytest tests -v
