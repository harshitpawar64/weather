[project]
name = "weathr"
version = "1.1.0"
description = "A fast terminal weather client"
readme = "README.md"
license = "MIT"
authors = [{ name = "Harshit Pawar", email = "hpchess64@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "msgspec>=0.21.1",
    "platformdirs>=4.11.3",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.1",
]
keywords = ["weather", "cli", "terminal", "air-quality"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/harshitpawar64/weather"
Repository = "https://github.com/harshitpawar64/weather"
Issues = "https://github.com/harshitpawar64/weather/issues"
Changelog = "https://github.com/harshitpawar64/weather/blob/main/CHANGELOG.md"

[project.scripts]
weather = "weather.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "ty>=0.0.71",
]

[tool.uv.build-backend]
module-name = "weather"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=weather --cov-report=term-missing --cov-branch -v"
